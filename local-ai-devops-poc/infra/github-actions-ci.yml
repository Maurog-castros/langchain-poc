name: local-ai-devops-poc CI

on:
  push:
    branches: [main, develop]
    paths:
      - "local-ai-devops-poc/**"
  pull_request:
    paths:
      - "local-ai-devops-poc/**"

defaults:
  run:
    working-directory: local-ai-devops-poc

jobs:
  # ── Backend: lint + type check + test ──────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local-ai-devops-poc/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          # Lightweight extras only needed for CI (no GPU models)
          pip install ruff pyright

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app/ scripts/ --select E,W,F,I --ignore E501

      - name: Type check (pyright)
        run: |
          cd backend
          pyright app/ --pythonversion 3.11 --level warning
        continue-on-error: true  # Non-blocking for PoC; enable strict when ready

      - name: Run tests
        run: |
          cd backend
          python -m pytest -v --tb=short
        env:
          APP_ENV: local
          LOG_LEVEL: WARNING  # Keep CI output clean

  # ── Frontend: type check + build ───────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: local-ai-devops-poc/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: local-ai-devops-poc/backend
          push: false
          tags: local-ai-devops-poc:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security: dependency audit ─────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          cd local-ai-devops-poc/backend
          pip-audit -r requirements.txt --ignore-vuln GHSA-jfh8-c2jp-jmvr
        continue-on-error: true  # Non-blocking; review findings

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        run: |
          cd local-ai-devops-poc/frontend
          npm audit --audit-level=high
        continue-on-error: true
